                        [[[
                            const t = Number(states['sensor.200xl_reefmat_total_usage']?.state);
                            const r = Number(states['sensor.200xl_reefmat_remaining_length']?.state);
                            const pct = Number.isFinite(t) && Number.isFinite(r) && t + r > 0 ? Math.max(0, Math.min(100, t / (t + r) * 100)) : 0;
