                      status: "[[[ const n = Number(entity.state); const c = !Number.isFinite(n) ? '#8a8a8a' : n < 0.03 ? '#c25964' : n < 0.1 ? '#9ecb91' : n < 0.2 ? '#f6d55c' : '#ffb347'; const label = !Number.isFinite(n) ? 'Unavailable' : n < 0.03 ? 'Low' : n < 0.1 ? 'Good' : n < 0.2 ? 'Watch' : 'High'; const ring = hass.themes?.darkMode ? 'rgba(255,255,255,0.72)' : 'rgba(0,0,0,0.36)'; return `<span title=\"${label}\" style=\"display:block;width:11px;height:11px;border-radius:50%;background:${c};border:2px solid ${ring};box-sizing:border-box;\"></span>`; ]]]"
                      range: "30d · ~5 readings"
                    styles:
                      grid:
                        - grid-template-areas: "'i n s status' 'graph graph graph graph' 'range range range range'"
                        - grid-template-columns: "24px 1fr min-content 12px"
                        - grid-template-rows: "26px 50px 12px"
                        - column-gap: "8px"
                        - row-gap: "3px"
                        - align-items: "center"
                      card:
                        - height: "106px"
                        - padding: "6px 8px"
                        - border-radius: "14px"
                        - background: "transparent"
                        - border: "1px solid var(--divider-color)"
                        - box-shadow: "none"
                        - overflow: "hidden"
                        - "--aas-param-line-color": "[[[ return hass.themes?.darkMode ? '#6ecddb' : '#245f9e'; ]]]"
                      icon:
                        - width: "19px"
                        - color: "var(--primary-text-color)"
                      img_cell:
                        - justify-self: "start"
                        - align-self: "center"
                        - width: "22px"
                        - height: "22px"
                      name:
                        - justify-self: "start"
                        - align-self: "center"
                        - font-size: "13px"
                        - font-weight: "600"
                        - line-height: "1.1"
                        - color: "var(--primary-text-color)"
                        - white-space: "nowrap"
                      state:
                        - justify-self: "end"
                        - align-self: "center"
                        - font-size: "16px"
                        - font-weight: "700"
                        - line-height: "1.1"
                        - color: "var(--primary-text-color)"
                        - white-space: "nowrap"
                      custom_fields:
                        graph:
                          - align-self: "stretch"
                          - width: "100%"
                          - height: "50px"
                          - display: "flex"
                          - align-items: "center"
                          - overflow: "hidden"
                          - border-radius: "7px"
                        status:
                          - justify-self: "end"
                          - align-self: "center"
                          - display: "flex"
                          - align-items: "center"
                        range:
                          - justify-self: "end"
                          - align-self: "center"
                          - font-size: "9px"
                          - line-height: "1"
                          - color: "var(--secondary-text-color)"
                          - padding-right: "1px"
                grid_options:
                  columns: "full"
                  rows: "auto"
            expanded: false
            animation: true
            clear: false
            clear-children: false
            expander-card-id: "mobile-200xl-testing"
            grid_options:
              columns: "full"
              rows: "auto"
      - type: "grid"
        cards:
          - type: "heading"
            heading: "ATO Reservoir"
            heading_style: "title"
            icon: "mdi:water-pump"
            grid_options:
              columns: "full"
              rows: "auto"
          - type: "custom:layout-card"
            layout_type: "custom:grid-layout"
            layout:
              grid-template-columns: "repeat(2,minmax(0,1fr))"
              grid-gap: "6px"
              margin: "0"
            cards:
              - type: "custom:mushroom-template-card"
                entity: "input_number.200xl_ato_remaining_ml"
                primary: "ATO Remaining"
                secondary: >-
                  {% set ml = states('input_number.200xl_ato_remaining_ml') | float(0) %}
                  {{ (ml / 1000) | round(1) }} L · {{ (ml / 3785.41) | round(2) }} gal · {{ ((ml / 18000) * 100) | round(0) }}%
                icon: "mdi:water"
                icon_color: >-
                  {% set pct = (states('input_number.200xl_ato_remaining_ml') | float(0) / 18000) * 100 %}
                  {% if pct < 20 %}red{% elif pct < 40 %}amber{% else %}green{% endif %}
                tap_action:
                  action: "more-info"
                card_mod:
                  style: "ha-card { border-radius:14px; border:1px solid var(--divider-color); box-shadow:none; }"
              - type: "custom:mushroom-template-card"
                entity: "input_button.200xl_ato_mark_full"
                primary: "Mark Reservoir Full"
                secondary: "Reset estimate to 18 L / 4.75 gal"
                icon: "mdi:water-plus"
                icon_color: "blue"
                tap_action:
                  action: "perform-action"
                  perform_action: "input_button.press"
                  target:
                    entity_id: "input_button.200xl_ato_mark_full"
                  confirmation:
                    text: "Set the 200XL ATO estimate to 18 liters?"
                hold_action:
                  action: "more-info"
                card_mod:
                  style: "ha-card { border-radius:14px; border:1px solid rgba(33,150,243,.45); box-shadow:none; }"
            grid_options:
              columns: "full"
              rows: "auto"
    cards:
      []
    icon: "mdi:fishbowl"
