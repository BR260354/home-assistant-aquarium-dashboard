# UI-created Home Assistant automation reference.
# Live entity: automation.aquarium_sterilizer_return_safety
alias: Aquarium Sterilizer Return Safety
description: >-
  Keeps the ReefPower sterilizer off whenever the Peninsula return is not
  Operational or is below 15%. After return safety is restored, waits three
  continuous minutes before restarting the sterilizer.
triggers:
  - trigger: numeric_state
    entity_id: number.aquarium_rsrun_peninsula_pump_1_speed
    below: 15
    id: speed_unsafe
  - trigger: numeric_state
    entity_id: number.aquarium_rsrun_peninsula_pump_1_speed
    above: 14.999
    id: speed_safe
  - trigger: state
    entity_id: sensor.aquarium_rsrun_peninsula_pump_1_state
    id: return_state_changed
  - trigger: state
    entity_id: switch.aquarium_reefpower_s2
    to: "on"
    id: sterilizer_turned_on
  - trigger: homeassistant
    event: start
    id: home_assistant_started
conditions: []
actions:
  - if:
      - condition: state
        entity_id: sensor.aquarium_rsrun_peninsula_pump_1_state
        state: operational
      - condition: numeric_state
        entity_id: number.aquarium_rsrun_peninsula_pump_1_speed
        above: 14.999
    then:
      - delay:
          minutes: 3
      - condition: state
        entity_id: sensor.aquarium_rsrun_peninsula_pump_1_state
        state: operational
      - condition: numeric_state
        entity_id: number.aquarium_rsrun_peninsula_pump_1_speed
        above: 14.999
      - action: switch.turn_on
        target:
          entity_id: switch.aquarium_reefpower_s2
    else:
      - action: switch.turn_off
        target:
          entity_id: switch.aquarium_reefpower_s2
mode: restart
