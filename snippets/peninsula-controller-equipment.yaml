# ReefBeat-inspired Peninsula Water Flow, Dosing, and Filtration / General expanders.
# ReefDose4 - 4-Part and ReefDose4-Extra are intentionally stacked vertically.
type: "vertical-stack"
cards:
  -
    type: "custom:expander-card"
    title: "Water Flow"
    cards:
