      style: |
        ha-card {
          background: transparent !important;
          box-shadow: none !important;
          padding: 0 4px;

          /* global chip sizing */
          --chip-height: 30px;
          --chip-icon-size: 20px;
          --chip-font-size: 0.8rem;
        }

        ha-card .chip-container {
          gap: 8px;
          justify-content: center;
          align-items: center;
        }

        ha-card mushroom-chip .chip {
          border-radius: 999px !important;
        }
    chips:
      -
        type: "template"
        entity: "sensor.bedroom_aquarium_sump_level"
        icon: "mdi:water-check"
        content: "Triple Sensor- {{ states('sensor.bedroom_aquarium_sump_level') }}"
        card_mod:
          style: |
            :host {
              {% set n = states('sensor.bedroom_aquarium_sump_level') %}
              --chip-background:
                {% if n=='Wet' %}
                  rgba(110, 205, 219, 0.4)   /* blue */
                {% elif n=='Dry' %}
                  rgba(246, 243, 169, 0.4) /* yellow */
                {% else %}
                  rgba(194, 89, 100, 0.4) /* red too high */
                {% endif %};

            }
