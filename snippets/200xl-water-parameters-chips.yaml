              status: "[[[ const n = Number(entity.state); const c = !Number.isFinite(n) ? '#8a8a8a' : n < 0.03 ? '#c25964' : n < 0.1 ? '#9ecb91' : n < 0.2 ? '#f6d55c' : '#ffb347'; const label = !Number.isFinite(n) ? 'Unavailable' : n < 0.03 ? 'Low' : n < 0.1 ? 'Good' : n < 0.2 ? 'Watch' : 'High'; const ring = hass.themes?.darkMode ? 'rgba(255,255,255,0.72)' : 'rgba(0,0,0,0.36)'; return `<span title=\"${label}\" style=\"display:block;width:11px;height:11px;border-radius:50%;background:${c};border:2px solid ${ring};box-sizing:border-box;\"></span>`; ]]]"
            styles:
              grid:
                -
                  grid-template-areas: "'i n s status' 'graph graph graph graph'"
                -
                  grid-template-columns: "22px 1fr min-content 12px"
                -
                  grid-template-rows: "24px 44px"
                -
                  column-gap: "8px"
                -
                  row-gap: "3px"
                -
                  align-items: "center"
              card:
                -
                  height: "84px"
                -
                  padding: "7px 10px 8px"
                -
                  border-radius: "12px"
                -
                  background: "transparent"
                -
                  border: "1px solid var(--divider-color)"
                -
                  box-shadow: "none"
                -
                  overflow: "hidden"
                -
                  --aas-param-line-color: "[[[ return hass.themes?.darkMode ? '#6ecddb' : '#245f9e'; ]]]"
              icon:
                -
                  width: "19px"
                -
                  color: "var(--primary-text-color)"
              img_cell:
                -
                  justify-self: "start"
                -
                  align-self: "center"
                -
                  width: "22px"
                -
                  height: "22px"
              name:
                -
                  justify-self: "start"
                -
                  align-self: "center"
                -
                  font-size: "13px"
                -
                  font-weight: "600"
                -
                  line-height: "1.1"
                -
                  color: "var(--primary-text-color)"
                -
                  white-space: "nowrap"
              state:
                -
                  justify-self: "end"
                -
                  align-self: "center"
                -
                  font-size: "16px"
                -
                  font-weight: "700"
                -
                  line-height: "1.1"
                -
                  color: "var(--primary-text-color)"
                -
                  white-space: "nowrap"
              custom_fields:
                graph:
                  -
                    align-self: "stretch"
                  -
                    width: "100%"
                  -
                    height: "44px"
                  -
                    display: "flex"
                  -
                    align-items: "center"
                  -
                    overflow: "hidden"
                  -
                    border-radius: "6px"
                  -
                    background: "linear-gradient(to bottom, rgba(255,179,71,0.30) 0.0%, rgba(255,179,71,0.30) 33.3%, rgba(246,213,92,0.30) 33.3%, rgba(246,213,92,0.30) 66.7%, rgba(158,203,145,0.34) 66.7%, rgba(158,203,145,0.34) 90.0%, rgba(194,89,100,0.34) 90.0%, rgba(194,89,100,0.34) 100.0%)"
                status:
                  -
                    justify-self: "end"
                  -
                    align-self: "center"
                  -
                    display: "flex"
                  -
                    align-items: "center"
            view_layout:
              grid-column: "1 / -1"
