# Complete 200XL water-parameter, Water Levels, and Additional Water Parameters stack.
# Exported from the production Controllers view; historical filename retained for existing links.
type: "vertical-stack"
cards:
  -
    type: "markdown"
    content: |
      Water Parameters
    text_only: true
    card_mod:
      style: |
        ha-card {
          background: none;
          box-shadow: none;
        }
        ha-markdown {
          font-size: 14px;
          font-weight: 500;
          line-height: 2.2;
        }
        p {
          margin: 0;
        }
  -
    type: "custom:layout-card"
    layout_type: "custom:grid-layout"
    layout:
      grid-template-columns: "repeat(2, minmax(0, 1fr))"
      grid-gap: "4px"
      mediaquery:
        "(max-width: 767px)":
          grid-template-columns: "1fr"
    cards:
      -
        type: "custom:button-card"
        entity: "sensor.bedroom_aquarium_temperature"
        name: "Display Temp"
        icon: "mdi:thermometer"
        show_icon: true
        show_name: true
        show_state: true
        state_display: "[[[ const n = Number(entity.state); const unit = entity.attributes.unit_of_measurement || '°F'; return Number.isFinite(n) ? `${n.toFixed(1)}${unit ? ' ' + unit : ''}` : 'Unavailable'; ]]]"
        tap_action:
          action: "more-info"
        hold_action:
          action: "more-info"
        custom_fields:
          graph:
            card:
              type: "custom:mini-graph-card"
              entities:
                - "sensor.bedroom_aquarium_temperature"
              group: true
              hours_to_show: 12
              points_per_hour: 1
              aggregate_func: "avg"
              height: 44
              line_width: 2.5
              line_color: "var(--aas-param-line-color, #245f9e)"
              lower_bound: 76.5
              upper_bound: 79.5
              min_bound_range: 3
              smoothing: true
              animate: true
              show:
                name: false
                icon: false
                state: false
                fill: false
                points: true
                labels: false
                extrema: false
                average: false
                legend: false
              tap_action:
                action: "none"
              card_mod:
                style: |
                  ha-card {
                    background: transparent !important;
                    --ha-card-background: transparent !important;
                    box-shadow: none !important;
                    border: none !important;
                  }
          status: "[[[ const n = Number(entity.state); const c = !Number.isFinite(n) ? '#8a8a8a' : n < 77 ? '#6ecddb' : n < 78 ? '#9ecb91' : n < 78.9 ? '#f6d55c' : '#c25964'; const label = !Number.isFinite(n) ? 'Unavailable' : n < 77 ? 'Low' : n < 78 ? 'Good' : n < 78.9 ? 'Watch' : 'High'; const ring = hass.themes?.darkMode ? 'rgba(255,255,255,0.72)' : 'rgba(0,0,0,0.36)'; return `<span title=\"${label}\" style=\"display:block;width:11px;height:11px;border-radius:50%;background:${c};border:2px solid ${ring};box-sizing:border-box;\"></span>`; ]]]"
        styles:
          grid:
            -
              grid-template-areas: "'i n s status' 'graph graph graph graph'"
            -
              grid-template-columns: "22px 1fr min-content 12px"
            -
              grid-template-rows: "24px 44px"
            -
              column-gap: "8px"
            -
              row-gap: "3px"
            -
              align-items: "center"
          card:
            -
              height: "84px"
            -
              padding: "7px 10px 8px"
            -
              border-radius: "12px"
            -
              background: "transparent"
            -
              border: "1px solid var(--divider-color)"
            -
              box-shadow: "none"
            -
              overflow: "hidden"
            -
              --aas-param-line-color: "[[[ return hass.themes?.darkMode ? '#6ecddb' : '#245f9e'; ]]]"
          icon:
            -
              width: "19px"
            -
              color: "var(--primary-text-color)"
          img_cell:
            -
              justify-self: "start"
            -
              align-self: "center"
            -
              width: "22px"
            -
              height: "22px"
          name:
            -
              justify-self: "start"
            -
              align-self: "center"
            -
              font-size: "13px"
            -
              font-weight: "600"
            -
              line-height: "1.1"
            -
              color: "var(--primary-text-color)"
            -
              white-space: "nowrap"
          state:
            -
              justify-self: "end"
            -
              align-self: "center"
            -
              font-size: "16px"
            -
              font-weight: "700"
            -
              line-height: "1.1"
            -
              color: "var(--primary-text-color)"
            -
              white-space: "nowrap"
          custom_fields:
            graph:
              -
                align-self: "stretch"
              -
                width: "100%"
              -
                height: "44px"
              -
                display: "flex"
              -
                align-items: "center"
              -
                overflow: "hidden"
              -
                border-radius: "6px"
              -
                background: "linear-gradient(to bottom, rgba(194,89,100,0.34) 0.0%, rgba(194,89,100,0.34) 20.0%, rgba(246,213,92,0.30) 20.0%, rgba(246,213,92,0.30) 50.0%, rgba(158,203,145,0.34) 50.0%, rgba(158,203,145,0.34) 83.3%, rgba(110,205,219,0.30) 83.3%, rgba(110,205,219,0.30) 100.0%)"
            status:
              -
                justify-self: "end"
              -
                align-self: "center"
              -
                display: "flex"
              -
                align-items: "center"
