              font-weight: "700"
            -
              line-height: "1.1"
            -
              color: "var(--primary-text-color)"
            -
              white-space: "nowrap"
          custom_fields:
            graph:
              -
                align-self: "stretch"
              -
                width: "100%"
              -
                height: "44px"
              -
                display: "flex"
              -
                align-items: "center"
              -
                overflow: "hidden"
              -
                border-radius: "6px"
              -
