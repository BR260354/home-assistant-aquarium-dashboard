alias: Aquarium - Fill Stop Automation
description: >-
  Calculate Peninsula HYDROS AWC fill volume using the configurable pump-rate
  helper and update saltwater inventory.
triggers:
  - trigger: state
    entity_id:
      - binary_sensor.aquarium_hydros_awc
    attribute: payload_fillpowerI
conditions:
  - condition: template
    value_template: |
      {{ trigger.from_state.attributes.payload_fillpowerI | float(0) > 0
         and trigger.to_state.attributes.payload_fillpowerI | float(0) == 0 }}
actions:
  - action: persistent_notification.create
    data:
      title: Fill Debug
      message: >
        FROM={{ trigger.from_state.attributes.payload_fillpowerI }} TO={{
        trigger.to_state.attributes.payload_fillpowerI }}
    enabled: false
  - variables:
      pump_rate_ml_min: >-
        {{ states('input_number.peninsula_awc_fill_pump_rate_ml_min') |
           float(400.2) }}
      runtime_seconds: |
        {{ as_timestamp(now()) -
           as_timestamp(states('input_datetime.awms_salt_last_filled_at')) }}
      volume: |
        {{ (runtime_seconds * pump_rate_ml_min / 60) | round(0) }}
      capacity_ml: >-
        {{ states('input_number.peninsula_salt_capacity_ml') |
           float(111700) }}
      current_remaining: >-
        {{ states('input_number.awms_salt_remaining_ml') |
           float(capacity_ml) }}
      remaining: |
        {{ [current_remaining - volume, 0] | max }}
  - action: input_number.set_value
    target:
      entity_id:
        - input_number.awms_salt_last_fill_volume_ml
    data:
      value: "{{ volume }}"
  - action: input_number.set_value
    target:
      entity_id:
        - input_number.awms_salt_remaining_ml
    data:
      value: "{{ remaining }}"
mode: single
